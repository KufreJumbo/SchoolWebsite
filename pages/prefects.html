    /**
     * ============================================================
     * RENDERING ENGINE
     * ============================================================
     */
    (() => {
      'use strict';

      function createCard(prefect) {
        const article = document.createElement('article');
        article.className = 'prf-card';

        const altText = prefect.imageAlt || `${prefect.name}, ${prefect.position}`;

        let quoteHTML = '';
        if (prefect.quote) {
          quoteHTML = `<p class="prf-quote">${prefect.quote}</p>`;
        }

        article.innerHTML = `
        <div class="prf-photo">
          <img src="${prefect.image}"
               alt="${altText}"
               loading="lazy"
               width="400"
               height="400">
        </div>
        <div class="prf-body">
          <span class="prf-position">${prefect.position}</span>
          <h3 class="prf-name">${prefect.name}</h3>
          ${quoteHTML}
        </div>
      `;

        return article;
      }

      function renderGrid(data, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const fragment = document.createDocumentFragment();
        data.forEach((p) => {
          fragment.appendChild(createCard(p));
        });
        container.appendChild(fragment);
      }

      function initScrollReveal() {
        const prefersReduced = window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

        if (prefersReduced) {
          document.querySelectorAll('.prf-card').forEach((card) => {
            card.classList.add('is-visible');
          });
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
        );

        document.querySelectorAll('.prf-card').forEach((card, i) => {
          card.style.transitionDelay = `${(i % 6) * 60}ms`;
          observer.observe(card);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        PREFECT_ROWS.forEach((row, index) => {
          renderGrid(row, `prf-grid-row-${index + 1}`);
        });
        initScrollReveal();
      });
    })();
  </script>
